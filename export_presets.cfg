[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
; The four Gemini_* images are referenced by nothing; excluding them saves ~12 Mo
; on the download. Two traps here, both found the hard way:
;   - the filter is only consulted when export_filter is "exclude". Left on
;     "all_resources" it is ignored and the files ship anyway.
;   - do NOT widen this to "Assets/*.jpg": the castles and pawns take their textures
;     from the .jpg files beside their .glb, so a wildcard there strips the models
;     bare and still reports a successful export.
export_filter="exclude"
include_filter=""
exclude_filter="*Gemini_Generated_Image_*,addons/ziva_agent/*"
; Written by the editor but unused by the "exclude" mode above. Kept because Godot
; logs a missing-key error for every export without it, which reads like a failure
; in CI logs and hides the ones that are real.
export_files=PackedStringArray()
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2
export_files=PackedStringArray()

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
; The desktop presets exist so a match can be played over a local network. A browser has
; no raw sockets, so the web build can only ever reach the relay — and when the relay is
; unavailable, a LAN match is the only way to play with anybody at all.

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="exclude"
include_filter=""
exclude_filter="*Gemini_Generated_Image_*,addons/ziva_agent/*"
export_path="build/windows/HexaBattle.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2
export_files=PackedStringArray()

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
; One file to hand out rather than an .exe and a .pck that must travel together.
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/product_name="Hexa Battle"

